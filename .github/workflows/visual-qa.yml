name: Visual QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/*.css
      - assets/*.js
      - assets/*.svg
      - assets/*.png
      - scripts/visual-check.cjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-qa
  cancel-in-progress: true

jobs:
  responsive-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start test server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/wsu-preview.log 2>&1 &
          sleep 2
      - name: Check layout and capture screenshots
        id: check
        continue-on-error: true
        run: node scripts/visual-check.cjs
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wsu-visual-qa
          path: assets/screenshots/
          retention-days: 30
      - name: Commit rendered screenshots
        if: always()
        run: |
          if [ -d assets/screenshots ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/screenshots
            git diff --cached --quiet || git commit -m 'test: update rendered desktop and mobile screenshots'
            git push || echo 'Screenshot commit could not be pushed'
          fi
      - name: Verify results
        if: steps.check.outcome == 'failure'
        run: exit 1
