name: Deploy WSU AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/polish.css
          test -s assets/app.js
          test -s assets/data.js
          test -s assets/school-emblem.png
          file assets/school-emblem.png
      - name: Prepare site
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -R assets dist/
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
